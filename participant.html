<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Session · Singing Jam</title><link rel="stylesheet" href="css/global.css"></head>
<body data-page="participant"><header class="topbar"><a class="brand" href="index.html"><span>SJ</span> Singing Jam</a><div id="connection-status" class="status-pill">Connecting…</div></header><main class="app-shell"><section id="participant-app" class="hidden"><div class="room-bar panel"><div><p class="eyebrow">JAM ROOM</p><strong id="room-code">—</strong><span id="member-count" class="muted">—</span></div><a class="button button-secondary" href="index.html">Leave</a></div><section class="panel current-panel"><p class="eyebrow">NOW PLAYING</p><h1 id="current-title">Waiting for the first song</h1><p id="current-artist" class="muted"></p><div id="lyrics" class="lyrics empty-state">The host will choose a song soon.</div></section><section class="panel"><div class="section-heading"><div><p class="eyebrow">REQUESTS</p><h2>Song queue</h2></div></div><div id="queue" class="queue-list"></div><form id="request-form" class="request-form"><input id="request-title" required placeholder="What should we sing next?"><input id="request-artist" placeholder="Artist (optional)"><input id="request-arrangement-url" type="url" placeholder="Chords or lyrics link (optional)"><button class="button button-primary">Request song</button></form></section></section><section id="participant-error" class="panel setup-panel"><h1>Join a session first.</h1><a class="button button-primary" href="join.html">Join jam</a></section></main><div id="toast" class="toast" role="status"></div><script type="module" src="js/pages/participant.js"></script></body></html>
